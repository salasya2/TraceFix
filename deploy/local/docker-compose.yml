services:
  postgres:
    image: postgres:17.4
    environment:
      POSTGRES_USER: tracefix
      POSTGRES_PASSWORD: tracefix
      POSTGRES_DB: tracefix
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracefix"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-password
    ports: ["9000:9000", "9001:9001"]

  temporal:
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: tracefix
      POSTGRES_PWD: tracefix
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["7233:7233"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.4.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  api:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    environment:
      TRACEFIX_ENV: development
      TRACEFIX_PROFILE: compose
      TRACEFIX_AUTH_MODE: dev
      TRACEFIX_SEED: "1"
      TRACEFIX_API_HOST: 0.0.0.0
      TRACEFIX_DATABASE_URL: postgresql+asyncpg://tracefix:tracefix@postgres:5432/tracefix
      TRACEFIX_ORCHESTRATOR: local
      TEMPORAL_ADDRESS: temporal:7233
      TRACEFIX_ARTIFACT_BACKEND: s3
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio-password
      TRACEFIX_MODEL_PROVIDER: fixture
      TRACEFIX_EXECUTOR: process
      TRACEFIX_ALLOW_INSECURE_EXECUTOR: "1"
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    command: ["python", "scripts/tf.py", "serve"]

  worker:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
    environment:
      TRACEFIX_ENV: development
      TRACEFIX_PROFILE: compose
      TRACEFIX_ORCHESTRATOR: temporal
      TRACEFIX_DATABASE_URL: postgresql+asyncpg://tracefix:tracefix@postgres:5432/tracefix
      TEMPORAL_ADDRESS: temporal:7233
      TRACEFIX_MODEL_PROVIDER: fixture
      TRACEFIX_EXECUTOR: process
      TRACEFIX_ALLOW_INSECURE_EXECUTOR: "1"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    command: ["python", "-m", "tracefix.orchestrator.worker"]
    profiles: ["temporal"]

  web:
    image: node:22.12.0-bookworm
    working_dir: /web
    volumes:
      - ../../apps/web:/web
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm exec vite --host 0.0.0.0 --port 5173"]
    ports: ["5173:5173"]
    environment:
      VITE_API_PROXY: http://api:8080
    depends_on: [api]

volumes:
  pgdata:
