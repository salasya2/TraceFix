apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracefix-api
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  selector:
    matchLabels: { app: tracefix-api }
  template:
    metadata:
      labels: { app: tracefix-api }
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          ports: [{ containerPort: 8080 }]
          env:
            - name: TRACEFIX_PROFILE
              value: production
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: executor-deny-egress
spec:
  podSelector:
    matchLabels: { tracefix-role: executor }
  policyTypes: ["Egress"]
  egress: []
